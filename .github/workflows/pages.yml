name: Publicar la página de instalación

on:
  push:
    branches: [main]
    paths:
      - 'Sitio/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Poner los enlaces reales de descarga
        env:
          REPO: ${{ github.repository }}
        run: |
          sed -i "s|{{REPO}}|$REPO|g" Sitio/instalar.html
          sed -i "s|{{DESCARGA_IPA}}|https://github.com/$REPO/releases/download/app/Bodega-unsigned.ipa|g" Sitio/instalar.html
          sed -i "s|{{ENLACE_REPO}}|https://github.com/$REPO|g" Sitio/instalar.html
          grep -o '{{[A-Z_]*}}' Sitio/instalar.html || echo "  (sin marcadores sin sustituir)"

      - name: Habilitar Pages si no lo esta
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Sitio

      - id: deploy
        uses: actions/deploy-pages@v4
