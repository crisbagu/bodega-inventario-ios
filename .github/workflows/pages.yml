name: Publicar la página de instalación

on:
  push:
    branches: [main]
    paths:
      - 'Sitio/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sustituir los enlaces del repo
        run: |
          sed -i "s|{{REPO}}|${{ github.repository }}|g" Sitio/instalar.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Sitio

      - id: deploy
        uses: actions/deploy-pages@v4
